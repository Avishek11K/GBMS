{% extends "base.html" %}

{% block title %}Contact{% endblock title %}
{% block body %}
<div class="container-fluid">
<form method="post" action="/contact">
    {% csrf_token %}
<div class="mb-3">
  <label for="exampleFormControlInput1" class="form-label">Name</label>
  <input type="text" name="name" class="form-control" id="exampleFormControlInput1" placeholder="Enter your name">
</div>
<div class="mb-3">
  <label for="exampleFormControlInput1" class="form-label">Email address</label>
  <input type="email" name="email" class="form-control" id="exampleFormControlInput1" placeholder="Enter email in the form: name@example.com">
</div>
<div class="mb-3">
  <label for="exampleFormControlInput1" class="form-label">Password</label>
  <input type="password" name="password" class="form-control" id="exampleFormControlInput1" placeholder="Enter your password">
</div>
<div class="mb-3,py-10">
  <label for="exampleFormControlTextarea1" class="form-label">Feedback</label>
  <textarea class="form-control" name="textarea" id="exampleFormControlTextarea1" rows="3"></textarea>
</div>
<div class="btn btn-secondary">
<button class="btn btn-primary">Submit</button>
</div>
</form>
</div>
{% endblock body %}
