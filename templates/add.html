{% include "header.html" %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Landlord</title>
    <style>
        .first{
           height: 40%;
           width: 30%;
           border: 4px solid seashell;
           padding: 50px;
           border-radius: 15px;
           margin-left:30%;
           margin-top:11%;
        }
    </style>
</head>
<body>
   <header>

   </header>
   <main>
    <div class="first">
        <form action="" method="post">
            {% csrf_token %}
            Title: <br>
            <input type="text" name="title" placeholder="Enter the title"> <br><br>
             Location: <br>
            <input type="text" name="location" placeholder="Enter the Location"> <br><br>
             Price: <br>
            <input type="text" name="price" placeholder="Enter the price"> <br><br>
             Description: <br>
            <textarea name="desc" placeholder="Enter the rent/house/ descriptions"></textarea><br>
             <br>
            <input type="file" name="image" multiple><br>
            <br>
            <input type="submit" name="save" value="Add">
            <span style="color: green;"><p></p></span>
        </form>

    </div>
   </main>
</body>
</html>
