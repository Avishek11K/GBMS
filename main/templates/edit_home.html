{% load static %}
{% include "llheader.html" %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit House</title>

    <link rel="stylesheet" href="{% static 'css/gharbhanda.css' %}">
    <link rel="stylesheet" href="{% static 'css/back.css' %}">

    <style>

        body{
            background:#F5F7FA;
            font-family:'Poppins',sans-serif;
        }

        .edit-wrapper{
            max-width:700px;
            margin:100px auto 40px;
            padding:0 20px;
        }

        .edit-card{
            background:#fff;
            border-radius:20px;
            border:1px solid #E2E8F0;
            padding:35px;
            box-shadow:0 12px 30px rgba(0,0,0,.08);
            transition:.3s;
        }

        .edit-card:hover{
            transform:translateY(-3px);
            box-shadow:0 18px 35px rgba(0,0,0,.12);
        }

        .edit-card h2{
            color:#1E3A8A;
            font-size:30px;
            margin-bottom:10px;
        }

        .subtitle{
            color:#64748B;
            margin-bottom:30px;
            line-height:1.6;
        }

        .form-group{
            margin-bottom:20px;
        }

        .form-group label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
            color:#334155;
        }

        .form-group input,
        .form-group textarea{
            width:100%;
            padding:13px 15px;
            background:#F8FAFC;
            border:1px solid #CBD5E1;
            border-radius:12px;
            outline:none;
            font-size:15px;
            transition:.25s;
            box-sizing:border-box;
        }

        .form-group input:focus,
        .form-group textarea:focus{
            background:#fff;
            border-color:#1E3A8A;
            box-shadow:0 0 0 4px rgba(30,58,138,.12);
        }

        textarea{
            resize:vertical;
        }

        .checkbox-group{
            display:flex;
            align-items:center;
            gap:10px;
            margin-top:10px;
        }

        .checkbox-group input{
            width:auto;
            transform:scale(1.15);
            accent-color:#1E3A8A;
        }

        .checkbox-group label{
            margin:0;
            font-weight:600;
            color:#334155;
        }

        .btn-group{
            display:flex;
            gap:15px;
            margin-top:35px;
        }

        .save-btn,
        .cancel-btn{
            flex:1;
            padding:13px;
            border-radius:12px;
            font-size:15px;
            font-weight:600;
            text-align:center;
            transition:.3s;
        }

        .save-btn{
            background:#1E3A8A;
            color:#fff;
            border:none;
            cursor:pointer;
        }

        .save-btn:hover{
            background:#163172;
        }

        .cancel-btn{
            background:#E2E8F0;
            color:#334155;
            text-decoration:none;
        }

        .cancel-btn:hover{
            background:#CBD5E1;
        }

        @media(max-width:768px){

            .edit-wrapper{
                margin-top:90px;
            }

            .edit-card{
                padding:25px;
            }

            .edit-card h2{
                font-size:26px;
            }

            .btn-group{
                flex-direction:column;
            }

            .save-btn,
            .cancel-btn{
                width:100%;
            }

        }

    </style>

</head>

<body>

<div class="edit-wrapper">

    <!-- Back Button -->
    <a href="{% url 'llhome' %}" class="back-link">
        <span class="arrow">←</span>
        <span>Back</span>
    </a>

    <div class="edit-card">

        <h2>Edit House</h2>

        <p class="subtitle">
            Update your property information below. Changes will be reflected immediately after saving.
        </p>

        <form method="post" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="form-group">
                <label>House Title</label>
                <input
                    type="text"
                    name="title"
                    value="{{ home.title }}"
                    required>
            </div>

            <div class="form-group">
                <label>Location</label>
                <input
                    type="text"
                    name="location"
                    value="{{ home.location }}"
                    required>
            </div>

            <div class="form-group">
                <label>Monthly Rent (Rs.)</label>
                <input
                    type="number"
                    name="price"
                    value="{{ home.price }}"
                    required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea
                    name="desc"
                    rows="5">{{ home.description }}</textarea>
            </div>

            <div class="form-group">
                <label>Add More Photos (Optional)</label>
                <input
                    type="file"
                    name="image"
                    multiple>
            </div>

            <div class="checkbox-group">
                <input
                    type="checkbox"
                    name="is_available"
                    {% if home.is_available %}checked{% endif %}>
                <label>Available for Rent</label>
            </div>

            <div class="btn-group">

                <button
                    type="submit"
                    class="save-btn"
                    onclick="return confirm('Are you sure you want to save the changes?')">

                    Save Changes

                </button>

                <a href="{% url 'llhome' %}" class="cancel-btn">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
