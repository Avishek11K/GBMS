{% include "header.html" %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
 <!-- styling starts :JC -->
    <style>
        {% comment %} ui added profile {% endcomment %}
        /* ---------- Profile Page ---------- */

body{
    background:#F5F7FA;
    font-family:'Poppins',sans-serif;
}

.my-profile-section{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:85vh;
    padding:40px 20px;
}

.profile-box{
    width:420px;
    background:#fff;
    border:none;
    border-radius:18px;
    padding:35px;
    box-shadow:0 15px 35px rgba(0,0,0,.08);
    transition:.35s;
}

.profile-box:hover{
    transform:translateY(-5px);
    box-shadow:0 20px 45px rgba(0,0,0,.12);
}

/* Avatar */

.profile-box .avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    display:block;
    margin:0 auto 20px;
    object-fit:cover;
    border:4px solid #2563EB;
    padding:4px;
    background:#fff;
}

/* Welcome Text */

.profile-box .title-text{
    text-align:center;
    color:#1E3A8A;
    font-size:24px;
    margin-bottom:30px;
}

/* User Information */

.profile-box .row-data{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 0;
    border-bottom:1px solid #E5E7EB;
    font-size:15px;
}

.profile-box .bold-lbl{
    color:#334155;
    font-weight:600;
}

.profile-box .row-data span:last-child{
    color:#475569;
    text-align:right;
    word-break:break-word;
}

/* Logout */

.profile-box .btn-block{
    margin-top:30px;
    text-align:center;
}

.profile-box .logout-btn{
    display:inline-block;
    background:#DC2626;
    color:white;
    text-decoration:none;
    padding:12px 35px;
    border-radius:10px;
    font-weight:600;
    transition:.3s;
}

.profile-box .logout-btn:hover{
    background:#B91C1C;
    transform:translateY(-2px);
}

/* Responsive */

@media(max-width:500px){

.profile-box{
    width:100%;
    padding:25px;
}

.profile-box .title-text{
    font-size:21px;
}

.profile-box .row-data{
    flex-direction:column;
    align-items:flex-start;
    gap:5px;
}

}
    </style>

    <!-- stylng ends -->
</head>
<body>

    <div class="my-profile-section">
        <div class="profile-box">
            <!-- if user consists image display else display avatar type -->
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile" class="avatar">
<!--username from inbuilt user model  -->
            <h2 class="title-text">Welcome, {{ user.username }}!</h2>

            <div class="row-data">
                <span class="bold-lbl">Username:</span>
                <span>{{ user.username }}</span>
            </div>
<!-- email -->
            <div class="row-data">
                <span class="bold-lbl">Email:</span>
                <span>{{ user.email }}</span>
            </div>
<!-- Role according to selected at the register -->
            <div class="row-data">
                <span class="bold-lbl">Role:</span>
                <span>{{ user.groups.all.0.name|default:"No Role" }}</span>
            </div>
<!--joined date  -->
            <div class="row-data">
                <span class="bold-lbl">Joined On:</span>
                <span>{{ user.date_joined|date:"M d, Y" }}</span>
            </div>
            <!-- contact: this is the roomseeker's own phone number, shown so
                 they can confirm what a landlord will see if the landlord looks them up -->
            <div class="row-data">
                <span class="bold-lbl">Phone:</span>
                <span>{{ rsp.phone|default:"Not added" }}</span>
            </div>
<!--logout redirected to loginuser.html  -->
            <div class="btn-block">
                <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
            </div>

        </div>
    </div>

</body>
</html>
