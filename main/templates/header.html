{% comment %} ui added header {% endcomment %}
/* ---------- Global ---------- */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#F5F7FA;
}

/* ---------- Header ---------- */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:65px;
    background:#1E3A8A;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:0 25px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
    z-index:1000;
}

nav{
    display:flex;
    align-items:center;
    gap:20px;
}

/* ---------- Top Icons ---------- */

.notification{
    width:28px;
    height:28px;
    background:white;
    border-radius:50%;
    padding:5px;
    cursor:pointer;
    transition:.3s;
}

.notification:hover{
    transform:scale(1.12);
    background:#D4A017;
}

/* ---------- Hamburger ---------- */

.hamburger{
    width:26px;
    cursor:pointer;
    position:fixed;
    top:18px;
    left:20px;
    z-index:1100;
    transition:.3s;
}

.hamburger:hover{
    transform:scale(1.1);
}

/* Hide Checkbox */

#menu-toggle{
    display:none;
}

/* ---------- Sidebar ---------- */

.sidebar{
    position:fixed;
    top:0;
    left:-260px;
    width:250px;
    height:100vh;
    background:#1E3A8A;
    padding-top:80px;
    transition:.35s ease;
    z-index:999;
    box-shadow:5px 0 20px rgba(0,0,0,.15);
}

/* Open Sidebar */

#menu-toggle:checked ~ .sidebar{
    left:0;
}

/* Sidebar Links */

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:16px 25px;
    font-size:16px;
    font-weight:500;
    transition:.3s;
    border-left:4px solid transparent;
}

.sidebar a:hover{
    background:#2563EB;
    border-left:4px solid #D4A017;
    padding-left:32px;
}

/* ---------- Unused Classes ---------- */

.nhome,
.ncontact,
.nabout,
.nlogout,
.user,
.one,
.two,
.three,
.four,
.five,
.six{
    display:none;
}

/* ---------- Main ---------- */

main{
    padding-top:80px;
}

/* ---------- Responsive ---------- */

@media(max-width:768px){

header{
    padding:0 15px;
}

nav{
    gap:12px;
}

.notification{
    width:25px;
    height:25px;
}

.sidebar{
    width:220px;
}

}
