<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
{% comment %} added cs {% endcomment %}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#F5F7FA;
}

/* ---------- Header ---------- */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:65px;
    background:#1E3A8A;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:0 25px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
    z-index:1000;
}

nav{
    display:flex;
    align-items:center;
    gap:20px;
}

/* ---------- Hamburger ---------- */

.hamburger{
    width:26px;
    cursor:pointer;
    position:fixed;
    top:18px;
    left:20px;
    z-index:1100;
    transition:.3s;
}

.hamburger:hover{
    transform:scale(1.1);
}

#menu-toggle{
    display:none;
}

/* ---------- Sidebar ---------- */

.sidebar{
    position:fixed;
    top:0;
    left:-260px;
    width:250px;
    height:100vh;
    background:#1E3A8A;
    padding-top:80px;
    transition:.35s ease;
    z-index:999;
    box-shadow:5px 0 20px rgba(0,0,0,.15);
}

#menu-toggle:checked ~ .sidebar{
    left:0;
}

/* Sidebar Links */

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:16px 25px;
    font-size:16px;
    font-weight:500;
    border-left:4px solid transparent;
    transition:.3s;
}

.sidebar a:hover{
    background:#2563EB;
    border-left:4px solid #D4A017;
    padding-left:32px;
}

/* ---------- Top Icons ---------- */

.notification{
    width:28px;
    height:28px;
    background:#FFFFFF;
    border-radius:50%;
    padding:5px;
    cursor:pointer;
    transition:.3s;
}

.notification:hover{
    background:#D4A017;
    transform:scale(1.12);
}

/* ---------- Notification Badge ---------- */

.notif-badge{
    position:absolute;
    top:-6px;
    right:-6px;
    background:#DC2626;
    color:white;
    min-width:18px;
    height:18px;
    border-radius:50%;
    font-size:10px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid white;
}

/* ---------- Main ---------- */

main{
    padding-top:80px;
}

/* ---------- Responsive ---------- */

@media(max-width:768px){

header{
    padding:0 15px;
}

nav{
    gap:12px;
}

.notification{
    width:25px;
    height:25px;
}

.sidebar{
    width:220px;
}

}
    </style>
</head>

<body>
<header>
        <div class="nav">
        <nav>
            {% comment %} <img class="hamburger" src="https://cdn-icons-png.flaticon.com/128/5727/5727012.png" alt=""> {% endcomment %}
            <label for="menu-toggle" class="hamburger-icon">
    <img class="hamburger" src="https://cdn-icons-png.flaticon.com/128/5727/5727012.png" alt="">
</label>

<input type="checkbox" id="menu-toggle">

<div class="sidebar">
    <a class="s1" href="{% url 'home.html' %}">House / Rents</a>
    <a class="s1" href="{% url 'my_applications' %}">My Applications</a>
    <a class="s1" href="{% url 'about.html' %}">About us</a>
    <a class="s1" href="{% url 'profile' %}">Profile</a>
    <a class="s1" href="{% url 'logout' %}">Logout</a>

</div>
            {% comment %} <img class="notification" id="home" src="https://cdn-icons-png.flaticon.com/128/2549/2549900.png" alt=""> {% endcomment %}
             <a href="{% url 'home.html' %}">
    <img class="notification" id="home" src="https://cdn-icons-png.flaticon.com/128/2549/2549900.png" alt="Home">
</a>



            <a href="{%url 'profile'%}">
                <img class="notification" id="contact" src="https://cdn-icons-png.flaticon.com/128/8143/8143259.png" alt="">
            </a>
            {% comment %} <a href="{% url 'my_applications' %}">
                <img class="notification" src="https://cdn-icons-png.flaticon.com/128/5636/5636698.png" alt="My applications">
            </a> {% endcomment %}
             {% comment %} <a href="{% url 'notify' %}" style="position:relative;">
            <img class="notification" src="https://cdn-icons-png.flaticon.com/128/3602/3602145.png" alt="Notifications">

          <a href="{% url 'rs_notifications' %}" style="position:relative;">

            {% if notify_count %}<span class="notif-badge">{{ notify_count }}</span>{% endif %}</a>
        </nav>
        </div>
    </header>
    <main>

</body>
</html>
