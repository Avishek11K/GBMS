{% include "llheader.html" %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        {% comment %} .my-profile-section { display:flex; justify-content:center; margin:60px auto; font-family:sans-serif; }
        .profile-box { background:#ffffff; width:350px; padding:20px; border:1px solid #ccc; border-radius:8px; }
        .profile-box .avatar { width:80px; height:80px; border-radius:50%; display:block; margin:0 auto 15px auto; object-fit:cover; }
        .profile-box .title-text { text-align:center; margin:0 0 20px 0; font-size:20px; }
        .profile-box .row-data { padding:8px 0; border-bottom:1px dashed #ddd; font-size:15px; display:flex; justify-content:space-between; }
        .profile-box .bold-lbl { font-weight:bold; color:#555; }
        .profile-box .btn-block { margin-top:25px; text-align:center; }
        .profile-box .logout-btn { display:inline-block; padding:8px 20px; background-color:#c0392b; color:white; text-decoration:none; font-weight:bold; border-radius:6px; } {% endcomment %}

        {% comment %} styling ui for llprofile {% endcomment %}

        /* ---------- Profile Page ---------- */

body{
    background:#F5F7FA;
    font-family:'Poppins',sans-serif;
}

.my-profile-section{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:85vh;
    padding:40px 20px;
}

.profile-box{
    width:420px;
    background:#fff;
    border:none;
    border-radius:18px;
    padding:35px;
    box-shadow:0 15px 35px rgba(0,0,0,.08);
    transition:.35s;
}

.profile-box:hover{
    transform:translateY(-5px);
    box-shadow:0 20px 45px rgba(0,0,0,.12);
}

/* Avatar */

.profile-box .avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    display:block;
    margin:0 auto 20px;
    object-fit:cover;
    border:4px solid #2563EB;
    padding:4px;
    background:#fff;
}

/* Welcome Text */

.profile-box .title-text{
    text-align:center;
    color:#1E3A8A;
    font-size:24px;
    margin-bottom:30px;
}

/* User Information */

.profile-box .row-data{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 0;
    border-bottom:1px solid #E5E7EB;
    font-size:15px;
}

.profile-box .bold-lbl{
    color:#334155;
    font-weight:600;
}

.profile-box .row-data span:last-child{
    color:#475569;
    text-align:right;
    word-break:break-word;
}

/* Logout */

.profile-box .btn-block{
    margin-top:30px;
    text-align:center;
}

.profile-box .logout-btn{
    display:inline-block;
    background:#DC2626;
    color:white;
    text-decoration:none;
    padding:12px 35px;
    border-radius:10px;
    font-weight:600;
    transition:.3s;
}

.profile-box .logout-btn:hover{
    background:#B91C1C;
    transform:translateY(-2px);
}

/* Responsive */

@media(max-width:500px){

.profile-box{
    width:100%;
    padding:25px;
}

.profile-box .title-text{
    font-size:21px;
}

.profile-box .row-data{
    flex-direction:column;
    align-items:flex-start;
    gap:5px;
}

}
    </style>
</head>
<body>
    <div class="my-profile-section">
        <div class="profile-box">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile" class="avatar">

            <h2 class="title-text">Welcome, {{ user.username }}!</h2>

            <div class="row-data">
                <span class="bold-lbl">Username:</span>
                <span>{{ user.username }}</span>
            </div>
            <div class="row-data">
                <span class="bold-lbl">Email:</span>
                <span>{{ user.email }}</span>
            </div>
            <div class="row-data">
                <span class="bold-lbl">Phone:</span>
                <span>{{ ll.phone|default:"Not added" }}</span>
            </div>
            <div class="row-data">
                <span class="bold-lbl">Role:</span>
                <span>{{ user.groups.all.0.name|default:"No Role" }}</span>
            </div>
            <div class="row-data">
                <span class="bold-lbl">Joined On:</span>
                <span>{{ user.date_joined|date:"M d, Y" }}</span>
            </div>

            <div class="btn-block">
                <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
            </div>
        </div>
    </div>
</body>
</html>
