{% include "llheader.html" %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        .my-profile-section { display:flex; justify-content:center; margin:60px auto; font-family:sans-serif; }
        .profile-box { background:#ffffff; width:350px; padding:20px; border:1px solid #ccc; border-radius:8px; }
        .profile-box .avatar { width:80px; height:80px; border-radius:50%; display:block; margin:0 auto 15px auto; object-fit:cover; }
        .profile-box .title-text { text-align:center; margin:0 0 20px 0; font-size:20px; }
        .profile-box .row-data { padding:8px 0; border-bottom:1px dashed #ddd; font-size:15px; display:flex; justify-content:space-between; }
        .profile-box .bold-lbl { font-weight:bold; color:#555; }
        .profile-box .btn-block { margin-top:25px; text-align:center; }
        .profile-box .logout-btn { display:inline-block; padding:8px 20px; background-color:#c0392b; color:white; text-decoration:none; font-weight:bold; border-radius:6px; }
    </style>
</head>
<body>
    <div class="my-profile-section">
        <div class="profile-box">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile" class="avatar">

            <h2 class="title-text">Welcome, {{ user.username }}!</h2>

            <div class="row-data">
                <span class="bold-lbl">Username:</span>
                <span>{{ user.username }}</span>
            </div>
            <div class="row-data">
                <span class="bold-lbl">Email:</span>
                <span>{{ user.email }}</span>
            </div>
            <div class="row-data">
                <span class="bold-lbl">Phone:</span>
                <span>{{ ll.phone|default:"Not added" }}</span>
            </div>
            <div class="row-data">
                <span class="bold-lbl">Role:</span>
                <span>{{ user.groups.all.0.name|default:"No Role" }}</span>
            </div>
            <div class="row-data">
                <span class="bold-lbl">Joined On:</span>
                <span>{{ user.date_joined|date:"M d, Y" }}</span>
            </div>

            <div class="btn-block">
                <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
            </div>
        </div>
    </div>
</body>
</html>
